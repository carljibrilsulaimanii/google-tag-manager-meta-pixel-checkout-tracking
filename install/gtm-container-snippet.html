<!--
  gtm-container-snippet.html -- Google Tag Manager container install
  Author:  Jibril Sulaiman
  Created: 2026-10-15
  Deploy:  Your site's master layout / page template, so it lands on EVERY page,
           checkout and order confirmation included. Part 1 goes as high in <head>
           as possible. Part 2 goes immediately after the opening <body> tag.
  What:    Google's standard container snippet. Replace GTM-XXXXXXX (both places)
           with your container id from Tag Manager > Admin > Install Google Tag Manager.
  Why:     Everything else in this repo lives inside the container. Once this is on
           the page, the checkout never needs another code change: variables, tags
           and triggers are all added in the Tag Manager UI.
-->

<!-- Part 1: paste as high in <head> as possible -->
<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
<!-- End Google Tag Manager -->

<!-- Part 2: paste immediately after the opening <body> tag -->
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
